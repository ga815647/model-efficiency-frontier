name: Chat execution

on:
  push:
    branches: ["efficiency-run/**"]
    paths: ["bridge/requests/*.json"]

permissions:
  contents: write

concurrency:
  group: chat-execution-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2 (official commit)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: bootstrap
        with:
          ref: main
          path: bootstrap
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v5.6.0 (official commit)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify authenticated push before product execution
        id: prepare
        continue-on-error: true
        working-directory: bootstrap
        env:
          EVENT_SHA: ${{ github.event.after }}
          EVENT_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p ../handoff ../output
          GITHUB_RUN_URL="$RUN_URL" python3 -m bridge.runner verify-transport \
            --repository . --event-sha "$EVENT_SHA" --ref-name "$EVENT_REF" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --output ../output --product-sha-file ../handoff/product.sha \
            --github-output "$GITHUB_OUTPUT"
      # The parent SHA comes ONLY from validated Git history, not request JSON.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.prepare.outcome == 'success'
        with:
          ref: ${{ steps.prepare.outputs.product_sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize local read-only results ref
        if: steps.prepare.outcome == 'success'
        run: |
          if git -C product show-ref --verify --quiet refs/remotes/origin/results; then
            git -C product update-ref refs/heads/results refs/remotes/origin/results
          fi
      - name: Recompute from pinned snapshot
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.operation == 'recompute'
        id: recompute
        continue-on-error: true
        working-directory: product
        env:
          EVENT_SHA: ${{ github.event.after }}
          EVENT_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -m bridge.runner --request ../handoff/request.json --event-sha "$EVENT_SHA" \
            --ref-name "$EVENT_REF" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --output ../output
      - name: Refresh public snapshot
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.operation == 'refresh'
        id: refresh
        continue-on-error: true
        working-directory: product
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          EVENT_SHA: ${{ github.event.after }}
          EVENT_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -m bridge.runner --request ../handoff/request.json --event-sha "$EVENT_SHA" \
            --ref-name "$EVENT_REF" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --output ../output
      - name: Append result (including failed execution)
        id: publish
        if: always() && steps.bootstrap.outcome == 'success'
        working-directory: bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_REF: ${{ github.ref_name }}
          REQUEST_ID: ${{ steps.prepare.outputs.request_id }}
          EVENT_SHA: ${{ github.event.after }}
          EVENT_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "${{ steps.prepare.outcome }}" = success ] && [ ! -f ../output/result.json ]; then
            python3 -m bridge.runner diagnostic-failure \
              --event-sha "$EVENT_SHA" --ref-name "$EVENT_REF" \
              --product-sha-file ../handoff/product.sha --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" --output ../output
          fi
          publication=$(python3 -m bridge.publish --output ../output \
            --remote "https://github.com/$REPOSITORY.git")
          echo "sha=$publication" >> "$GITHUB_OUTPUT"
          echo "Request: ${REQUEST_ID:-$REQUEST_REF}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${{ github.run_id }} attempt ${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Result commit: $publication" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failed execution as red run
        if: always()
        working-directory: bootstrap
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          RECOMPUTE_OUTCOME: ${{ steps.recompute.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python3 -m bridge.runner assert-success --output ../output
          test "$PREPARE_OUTCOME" = success
          test "$PUBLISH_OUTCOME" = success
          if [ "$RECOMPUTE_OUTCOME" != success ] && [ "$REFRESH_OUTCOME" != success ]; then
            exit 1
          fi
      # actions/upload-artifact v4.6.2 (official commit); HTML is an attachment, not a website.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.publish.outcome == 'success' && steps.prepare.outcome == 'success' && (steps.recompute.outcome == 'success' || steps.refresh.outcome == 'success')
        with:
          name: report-${{ steps.prepare.outputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/report.html
          if-no-files-found: error
